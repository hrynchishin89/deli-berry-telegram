name: Deploy Deli Berry catalog

on:
  push:
    branches: [main]
    paths:
      - catalog-site/publish-release.txt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install locked dependencies
        working-directory: cloudflare
        run: npm ci
      - name: Verify Mini App
        working-directory: cloudflare
        run: npm run check:local
      - name: Build temporary device preview
        working-directory: cloudflare
        run: npm run build:device-preview
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload catalog artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloudflare/device-preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
