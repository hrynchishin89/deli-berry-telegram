name: Deli Berry VK community sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check safely or apply the reviewed VK community update
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply

permissions:
  contents: read

jobs:
  sync:
    name: Verify and sync community
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check script syntax
        run: node --check scripts/vk-community-sync.js

      - name: Run the requested mode
        env:
          VK_MODE: ${{ inputs.mode }}
        run: node scripts/vk-community-sync.js
